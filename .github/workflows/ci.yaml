---
name: "Build"

on:
  push:
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

# Main is exempt from cancellation so every main SHA gets its image — the type=sha and latest
# tags depend on those builds completing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE_NAME: blt950/where2fly

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          path: "."

      - name: Check formatting
        run: ./vendor/bin/pint --test

  tests:
    name: PHPUnit
    runs-on: ubuntu-latest
    needs: lint

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: where2fly_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          path: "."
          setup-node: "true"

      - name: Build frontend assets
        run: npm run build

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run tests
        run: php artisan test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: where2fly_test
          DB_USERNAME: root
          DB_PASSWORD: root

  build-container:
    name: Build Container
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push'
    steps:
      - name: configure docker buildx
        uses: docker/setup-buildx-action@v4

      - name: login to github container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: setup container metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=sha,event=branch,prefix=
            type=semver,event=tag,pattern=v{{version}}
            type=semver,event=tag,pattern=v{{major}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Checkout open repo
        uses: actions/checkout@v7

      - name: Checkout private fonts repo
        uses: actions/checkout@v7
        with:
          repository: blt950/where2fly-fonts
          token: ${{ secrets.FONTS_REPO_TOKEN }}
          path: fonts-repo

      - name: Copy fonts
        run: |
          mkdir -p resources/fonts
          cp -r fonts-repo/* resources/fonts/
          ls -la resources/fonts

      - name: build & push container image
        uses: docker/build-push-action@v7
        with:
          context: "."
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          # Mounted rather than passed as a build-arg, which would persist in the image history.
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

      # Boots the framework end to end, so a misordered composer/autoloader step fails here
      # rather than on the first production request.
      - name: Smoke test image
        run: |
          IMAGE_TAG="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          docker run --rm "$IMAGE_TAG" php artisan about
