<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161925">
<title>Where2Fly | Responsive prototype</title>
<link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&family=Work+Sans:wght@400;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css">
<style>
/* Prototype only: mock data, real MapLibre. Tokens mirror resources/sass/_variables.scss. */
:root {
    --primary: #ddb81c;
    --primary-dark: #9a8014;
    --secondary: #161925;
    --tertiary: #2f3549;
    --tertiary-dark: #282d3f;
    --gray: #6c757d;
    --gray-500: #adb5bd;
    --muted: #a3abc7;
    --offwhite: #fffdf7;
    --bluewhite: #e4f0ff;
    --header-h: 3.438rem;
    --sidebar-w: 31.25rem;
    --footer-h: 1.875rem;
    --handle-h: 72px;
    --tabbar-h: 60px;
    --y: 0px;
}

* { box-sizing: border-box; }

html, body { height: 100%; margin: 0; }

body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    background: var(--secondary);
    color: var(--bluewhite);
    font-family: 'Work Sans', sans-serif;
    font-size: 0.875rem;
    line-height: 1.6;
}

button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, button, .kanit { font-family: 'Kanit', 'Work Sans', sans-serif; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
svg.ico { flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; }

/* ---------- Header ---------- */
.top {
    flex: none;
    height: var(--header-h);
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0 1rem;
    background: var(--secondary);
}
.logo {
    font-family: 'Kanit', sans-serif;
    font-weight: 500;
    font-size: 1.53rem;
    line-height: 1.2;
    color: #fff;
    text-decoration: none;
    border-bottom: 0.25rem solid var(--primary);
}
.donate {
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 44px;
    text-decoration: none;
}
.donate span {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: var(--offwhite);
    color: var(--secondary);
    font-family: 'Kanit', sans-serif;
    font-size: 0.8125rem;
}
.topnav { margin-left: auto; display: flex; align-self: stretch; }
.topnav button {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.35rem 0.9rem 0;
    margin-left: 0.5rem;
    background: transparent;
    border: 0;
    border-bottom: 0.25rem solid transparent;
    color: var(--gray-500);
    font-size: 1rem;
}
.topnav button:hover { border-bottom-color: rgba(255, 255, 255, 0.25); }
.topnav button[aria-current='page'] { color: #fff; border-bottom-color: var(--primary); }

/* ---------- Stage: sidebar + map (desktop), map + sheet (mobile) ---------- */
.stage { position: relative; flex: 1 1 0; min-height: 0; display: flex; }

#map { flex: 1 1 0; min-width: 0; background: #090909; }
.maplibregl-map { font: inherit; }
.maplibregl-canvas:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
.map-error {
    position: absolute;
    inset: auto 1rem 50% auto;
    padding: 0.75rem 1rem;
    background: var(--tertiary);
    color: var(--bluewhite);
}

.sheet {
    order: -1;
    flex: none;
    width: var(--sidebar-w);
    display: flex;
    flex-direction: column;
    background: var(--secondary);
}
.sheet-handle {
    flex: none;
    display: block;
    width: 100%;
    padding: 1rem;
    border: 0;
    background: var(--secondary);
    color: #fff;
    text-align: left;
    cursor: default;
}
.sheet-handle .grip { display: none; }
.sheet-handle .t { display: block; font-weight: 500; font-size: 2rem; line-height: 1.2; }
.sheet-handle .s { display: block; font-weight: 400; font-size: 1rem; color: var(--bluewhite); }
.sheet-close { display: none; }
.sheet-body { flex: 1 1 0; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }

.pad { padding: 1rem; display: flex; flex-direction: column; gap: 1.1rem; }

/* Floating airport card over the map, as today's .popup-container. */
.detail {
    position: absolute;
    left: calc(var(--sidebar-w) + 1rem);
    top: 1rem;
    width: 400px;
    max-height: calc(100% - var(--footer-h) - 2rem);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    z-index: 5;
}
.card { flex: none; padding: 1rem; background: rgba(22, 25, 37, 0.5); }

/* Mobile: the same cards as tabs inside the drawer. */
.cardtabs { position: sticky; top: 0; z-index: 1; display: flex; padding: 0 1rem; background: var(--secondary); border-bottom: 1px solid var(--tertiary); }
.cardtabs button { flex: 1 1 0; min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0; background: transparent; border: 0; border-bottom: 3px solid transparent; color: var(--gray-500); font-size: 0.95rem; }
.cardtabs button[aria-selected='true'] { color: #fff; border-bottom-color: var(--primary); }
.cardtabs span { min-width: 1.4rem; padding: 0 0.3rem; background: var(--tertiary); color: var(--bluewhite); font-size: 0.75rem; line-height: 1.4rem; text-align: center; }
.cardtabs + .pad { padding-top: 1rem; }

.ftable { width: 100%; border-collapse: collapse; }
.ftable th { text-align: left; font-weight: 700; padding: 0.4rem 0.5rem 0.4rem 0; border-bottom: 1px solid var(--gray); }
.ftable td { padding: 0.55rem 0.5rem 0.55rem 0; border-bottom: 1px solid rgba(173, 181, 189, 0.25); }
.ftable td:first-child { color: #fff; font-family: 'Kanit', sans-serif; }
.detail:empty { display: none; }
.detail-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 0.75rem; }
.detail-head h2 { margin: 0; font-size: 1.5rem; font-weight: 500; color: #fff; line-height: 1.2; }
.detail-head p { margin: 0; font-family: 'Kanit', sans-serif; }

.map-ui {
    position: absolute;
    top: 1rem;
    right: 1rem;
    z-index: 6;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.5rem;
}
.map-toggle {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    background: rgba(22, 25, 37, 0.85);
    border: 1px solid var(--gray);
    border-radius: 2px;
    color: var(--gray-500);
}
.map-toggle:hover, .map-toggle[aria-expanded='true'] { color: var(--primary); border-color: var(--primary); }
.map-panel {
    width: 13rem;
    padding: 0.75rem 1rem;
    background: rgba(22, 25, 37, 0.92);
    border: 1px solid var(--gray);
    font-size: 0.8125rem;
}
.map-panel legend { padding: 0; margin-bottom: 0.25rem; color: var(--muted); font-size: 0.6875rem; text-transform: uppercase; }
.map-panel fieldset { border: 0; margin: 0; padding: 0; }
.map-panel label { display: flex; align-items: center; gap: 0.6rem; min-height: 40px; }

.attrib {
    position: absolute;
    right: 0;
    bottom: 0;
    left: var(--sidebar-w);
    height: var(--footer-h);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 0.5rem;
    background: rgba(22, 25, 37, 0.75);
    font-family: 'Kanit', sans-serif;
    font-weight: 300;
    z-index: 4;
}
.attrib a { color: inherit; }

.tabbar { display: none; }

/* ---------- Shared components ---------- */
label, .label { color: var(--bluewhite); }
.field { display: flex; flex-direction: column; gap: 0.35rem; }
.control {
    width: 100%;
    height: 2.75rem;
    padding: 0 0.75rem;
    border: 0;
    border-radius: 0;
    background: var(--tertiary);
    color: var(--offwhite);
    font-size: 1rem;
}
.control::placeholder { color: #c8c8c8; }
.control.icao { text-transform: uppercase; }
.control.icao::placeholder { text-transform: none; }
.check { display: flex; align-items: center; gap: 0.6rem; min-height: 44px; }
input[type='checkbox'], input[type='radio'] { width: 1.25rem; height: 1.25rem; margin: 0; accent-color: var(--primary); }

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    min-height: 44px;
    padding: 0 0.85rem;
    border: 1px solid var(--primary);
    border-radius: 0;
    background: transparent;
    color: var(--primary);
    font-family: 'Kanit', sans-serif;
    font-size: 0.875rem;
    text-decoration: none;
    white-space: nowrap;
}
.btn:hover { background: rgba(221, 184, 28, 0.12); }
.btn.on, .btn.primary { background: var(--primary); color: var(--secondary); border: 2px solid var(--primary-dark); font-weight: 500; }
.btn.light { border-color: #f8f9fa; color: #f8f9fa; }
.btn.light:hover { background: rgba(255, 255, 255, 0.1); }
.btn.submit { width: 100%; height: 3rem; text-transform: uppercase; font-size: 0.95rem; }

.seg { display: flex; }
.seg .btn { flex: 1 1 0; padding: 0 0.25rem; }
.seg .btn + .btn { margin-left: -1px; }
.chips { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 2px; }
.chips > * { flex: none; }
select.btn { background: var(--secondary); padding: 0 0.5rem; }

.expand { display: flex; align-items: center; gap: 0.75rem; }
.expand i { flex: 1 1 0; height: 1px; background: rgba(221, 184, 28, 0.5); }
.expand button { min-height: 44px; padding: 0 1rem; background: transparent; border: 1px solid rgba(221, 184, 28, 0.6); color: var(--bluewhite); font-weight: 300; }

.tri { display: flex; align-items: center; gap: 0.75rem; }
.tri .grp { display: flex; flex: none; background: #212529; border-radius: 2px; }
.tri .grp button { width: 44px; height: 40px; padding: 0; border: 0; background: transparent; color: #a3a3a3; font-size: 0.95rem; }
.tri .grp button[aria-pressed='true'] { color: #fff; }
.tri .grp button.ex[aria-pressed='true'] { background: rgba(135, 15, 12, 0.6); }
.tri .grp button.ne[aria-pressed='true'] { background: var(--tertiary); }
.tri .grp button.in[aria-pressed='true'] { background: rgba(25, 135, 84, 0.6); }

/* Two native range inputs sharing one track, standing in for noUiSlider. */
.dual { position: relative; height: 44px; margin: 0 1rem; }
.dual .track { position: absolute; left: -1rem; right: -1rem; top: 13px; height: 18px; background: var(--tertiary); border: 1px solid #454d68; border-radius: 2px; }
.dual .fill { position: absolute; top: 14px; height: 16px; background: var(--secondary); }
.dual input {
    position: absolute;
    left: -17px;
    width: calc(100% + 34px);
    top: 0;
    height: 44px;
    margin: 0;
    background: transparent;
    pointer-events: none;
    -webkit-appearance: none;
    appearance: none;
}
.dual input::-webkit-slider-runnable-track { background: transparent; height: 44px; }
.dual input::-moz-range-track { background: transparent; height: 44px; }
.dual input::-webkit-slider-thumb {
    -webkit-appearance: none;
    pointer-events: auto;
    width: 34px;
    height: 26px;
    margin-top: 9px;
    background: var(--bluewhite);
    border: 1px solid #454d68;
    border-radius: 2px;
    cursor: grab;
}
.dual input::-moz-range-thumb {
    pointer-events: auto;
    width: 34px;
    height: 26px;
    background: var(--bluewhite);
    border: 1px solid #454d68;
    border-radius: 2px;
    cursor: grab;
}

.results-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem; padding: 0.75rem 1rem; background: var(--tertiary); border-bottom: 2px solid var(--secondary); }
.results-header h2 { margin: 0; font-size: 1.25rem; font-weight: 400; color: #fff; }
.toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 0 1rem 1rem; }

.row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    width: 100%;
    min-height: 60px;
    padding: 0.5rem 1rem;
    border: 0;
    border-bottom: 1px solid var(--secondary);
    background: var(--tertiary);
    color: var(--bluewhite);
    text-align: left;
    font-family: 'Work Sans', sans-serif;
}
.row:hover, .row.active { background: var(--tertiary-dark); }
.row.active { box-shadow: inset 4px 0 0 var(--primary); }
.row .n { flex: none; width: 1.4rem; font-weight: 700; color: var(--muted); }
.row .main { flex: 1 1 0; min-width: 0; }
.row .main b { display: block; font-family: 'Kanit', sans-serif; font-weight: 400; font-size: 1rem; color: #fff; }
.row .main span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .num { flex: none; text-align: right; }
.row .num b { display: block; font-weight: 400; color: #fff; }
.row .num span { display: block; color: #c9d3e6; }
.row .scores { flex: none; width: 5.5rem; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
.row .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--primary); border: 2px solid var(--offwhite); }
.empty { padding: 1rem; background: var(--tertiary); color: #9fc5e8; text-align: center; }
.warn { color: #ffc107; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; background: var(--tertiary); }
.chiprow { display: flex; flex-wrap: wrap; gap: 0.5rem; }
dl { margin: 0; }
dt { font-weight: 700; margin-top: 1rem; }
dd { margin: 0; overflow-wrap: anywhere; }
.trip { padding: 0.6rem 0.75rem; background: var(--tertiary); color: #fff; }
.actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem; margin-top: 1rem; }
.actions .btn { padding: 0 0.4rem; white-space: normal; text-align: center; line-height: 1.2; }
.scn { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem; background: var(--tertiary); }
.scn div { flex: 1 1 0; min-width: 0; }
.scn b { display: block; font-family: 'Kanit', sans-serif; font-weight: 400; font-size: 0.95rem; color: #fff; }
.note { margin: 0; padding: 1rem; color: #c9d3e6; font-size: 0.8rem; }
.note a { color: inherit; }

@media (max-width: 991.98px) {
    :root { --sidebar-w: 25rem; }
    .detail { width: 300px; }
    .topnav button { padding-inline: 0.5rem; margin-left: 0.25rem; }
}

/* ---------- Mobile: full-bleed map, bottom sheet, tab bar ---------- */
@media (max-width: 767.98px) {
    :root { --header-h: 3rem; }

    .top { padding: 0 0.5rem 0 1rem; justify-content: space-between; }
    .logo { font-size: 1.375rem; }
    .topnav { display: none; }

    .stage { display: block; overflow: hidden; }
    #map { position: absolute; inset: 0; }

    .sheet {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        width: auto;
        height: 100%;
        display: block;
        border-top: 1px solid #454d68;
        box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.45);
        transform: translateY(var(--y));
        transition: transform 220ms ease;
        z-index: 10;
        will-change: transform;
    }
    .sheet.dragging { transition: none; }
    .sheet-handle {
        position: relative;
        height: var(--handle-h);
        padding: 8px 64px 0 16px;
        cursor: grab;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }
    .sheet-handle .grip { display: block; position: absolute; left: 50%; top: 8px; width: 36px; height: 4px; margin-left: -18px; background: var(--gray); border-radius: 2px; }
    .sheet-handle .t { margin-top: 10px; font-size: 1.25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sheet-handle .s { font-weight: 300; font-size: 0.875rem; color: #c9d3e6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sheet-close {
        position: absolute;
        right: 10px;
        top: 16px;
        width: 44px;
        height: 44px;
        padding: 0;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: 1px solid var(--gray);
        color: var(--bluewhite);
    }
    .has-selected .sheet-close { display: flex; }
    .sheet-body { height: calc(100% - var(--y) - var(--handle-h)); }

    .pad { padding-top: 0.25rem; }
    .detail { display: none; }
    .map-ui { top: 12px; right: 12px; }
    .attrib {
        left: 0;
        right: auto;
        top: 0;
        bottom: auto;
        height: auto;
        padding: 1px 6px;
        font-size: 0.6875rem;
        background: rgba(22, 25, 37, 0.6);
    }

    .tabbar {
        flex: none;
        display: flex;
        height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
        padding-bottom: env(safe-area-inset-bottom);
        background: var(--secondary);
        border-top: 1px solid var(--tertiary);
        z-index: 20;
    }
    .tabbar button {
        flex: 1 1 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        padding: 0;
        background: transparent;
        border: 0;
        border-top: 3px solid transparent;
        color: var(--gray-500);
        font-size: 0.75rem;
    }
    .tabbar button[aria-current='page'] { color: #fff; border-top-color: var(--primary); }
}

@media (max-width: 375px) { .donate { display: none; } }

@media (prefers-reduced-motion: reduce) { .sheet { transition: none !important; } }
</style>
</head>
<body>

<header class="top">
    <a class="logo" href="#">Where2Fly</a>
    <a class="donate" href="https://ko-fi.com/X7X21V3MEX" target="_blank" rel="noopener">
        <span>
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="fill:#c8323c"><path d="M12 21C5 15 3 12 3 8.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 9 1.5C21 12 19 15 12 21z"/></svg>
            Buy me a coffee
        </span>
    </a>
    <nav class="topnav" aria-label="Main" id="topnav"></nav>
</header>

<div class="stage" id="stage">
    <div id="map" aria-label="Map"></div>

    <div class="map-ui">
        <button class="map-toggle" id="layersBtn" type="button" aria-label="Map layers and projection" aria-expanded="false"></button>
        <div class="map-panel" id="layersPanel" hidden>
            <fieldset>
                <legend>Projection</legend>
                <label><input type="radio" name="projection" value="mercator" checked> 2D map</label>
                <label><input type="radio" name="projection" value="globe"> 3D globe</label>
            </fieldset>
        </div>
    </div>

    <div class="attrib">
        <span>&copy; <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</span>
    </div>

    <section class="sheet" id="sheet" aria-label="Panel">
        <button class="sheet-handle" id="handle" type="button">
            <span class="grip"></span>
            <span class="t kanit" id="title"></span>
            <span class="s kanit" id="sub"></span>
        </button>
        <button class="sheet-close" id="closeBtn" type="button" aria-label="Close airport and go back" data-act="back"></button>
        <div class="sheet-body" id="body"></div>
    </section>

    <aside class="detail" id="detail" aria-live="polite"></aside>
</div>

<nav class="tabbar" aria-label="Main" id="tabbar"></nav>

<script type="module">
const MAPLIBRE = 'https://unpkg.com/maplibre-gl@6.16.0/dist';
const CARTO_STYLE = 'https://basemaps.cartocdn.com/gl/dark-matter-nolabels-gl-style/style.json';
const CARTO_GLYPHS = 'https://tiles.basemaps.cartocdn.com/fonts/{fontstack}/{range}.pbf';
const HANDLE_H = 72;

/* ---------- Mock data ---------- */

const ICON = {
    windy: ['Windy', 'M3 8h10a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7a2.5 2.5 0 1 1-2.5 2.5'],
    gusts: ['Gusting Wind', 'M3 7h11a3 3 0 1 0-3-3M3 12h16M3 17h11a3 3 0 1 1-3 3'],
    cross: ['Crosswind', 'M4 4l16 16M20 4L4 20M14 20h6v-6M14 4h6v6'],
    sight: ['Reduced Sight', 'M2 12s4-7 10-7s10 7 10 7s-4 7-10 7S2 12 2 12zM4 20L20 4'],
    ceil: ['Low Ceiling', 'M4 4h16M12 20V9M7 13l5-5l5 5'],
    fog: ['Foggy', 'M7 6h10M4 10h16M4 14h16M7 18h10'],
    snow: ['Heavy Snow', 'M12 2v20M3.5 7l17 10M20.5 7l-17 10'],
    storm: ['Thunderstorm', 'M13 2L5 14h6l-1 8l8-12h-6l1-8z'],
    atc: ['VATSIM ATC', 'M4 14v-2a8 8 0 0 1 16 0v2M4 14h3v5H4zM17 14h3v5h-3zM20 19c0 2-2 3-6 3'],
    event: ['VATSIM Event', 'M4 6h16v15H4zM4 10h16M8 3v4M16 3v4'],
    pop: ['VATSIM Popular Airport', 'M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4c0 2 1 3 2 3c0-3-1-5 1-9z'],
    search: ['', 'M17 10.5a6.5 6.5 0 1 1-13 0a6.5 6.5 0 0 1 13 0zM15.5 15.5L21 21'],
    list: ['', 'M8 6h13M8 12h13M8 18h13M3 6h1.5M3 12h1.5M3 18h1.5'],
    map: ['', 'M9 4L3 6v14l6-2l6 2l6-2V4l-6 2l-6-2zM9 4v14M15 6v14'],
    more: ['', 'M4 6h16M4 12h16M4 18h16'],
    close: ['', 'M5 5l14 14M19 5L5 19'],
    chevron: ['', 'M9 5l7 7l-7 7'],

/* ---------- Geometry ---------- */

const rad = (d) => d * Math.PI / 180;
const deg = (r) => r * 180 / Math.PI;
const distanceNm = (a, b) => {
    const h = Math.sin(rad(b.lat - a.lat) / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(rad(b.lon - a.lon) / 2) ** 2;
    return 2 * 3440.065 * Math.asin(Math.sqrt(h));
};
const greatCircle = (a, b, steps = 48) => {
    const v = (p) => [Math.cos(rad(p.lat)) * Math.cos(rad(p.lon)), Math.cos(rad(p.lat)) * Math.sin(rad(p.lon)), Math.sin(rad(p.lat))];
    const [p, q] = [v(a), v(b)];
    const omega = Math.acos(Math.min(1, p[0] * q[0] + p[1] * q[1] + p[2] * q[2]));
    if (omega < 1e-6) return [[a.lon, a.lat], [b.lon, b.lat]];
    return Array.from({ length: steps + 1 }, (_, i) => {
        const t = i / steps;
        const [k1, k2] = [Math.sin((1 - t) * omega) / Math.sin(omega), Math.sin(t * omega) / Math.sin(omega)];
        const [x, y, z] = [0, 1, 2].map((n) => k1 * p[n] + k2 * q[n]);
        return [deg(Math.atan2(y, x)), deg(Math.atan2(z, Math.hypot(x, y)))];
    });
};

    state.formError = '';
    state.anchor = anchor.icao;

    if (state.mode === 'flights') {
        if (!BY_ICAO[state.other] || state.other === anchor.icao) { state.formError = 'Enter a different arrival airport from the mock data, for example EHAM.'; return; }
        state.stage = 'routes';
        state.selected = null;
        return;
    }

    const [, , cruise, climb] = AIRCRAFT[state.aircraft];
    const rank = (a) => (state.sortWeather ? a.scores.filter((s) => WEATHER.includes(s)).length : 0)
        + (state.sortAtc ? a.scores.filter((s) => NETWORK.includes(s)).length : 0);
    state.results = AIRPORTS
        .filter((a) => a.icao !== anchor.icao)
        .map((a) => {
            const dist = distanceNm(anchor, a);
            return { ...a, dist: Math.round(dist), time: dist / cruise + climb };
        })
        .filter((a) => a.time >= state.minTime && a.time <= state.maxTime)
        .filter((a) => Object.entries(state.filters).every(([k, v]) => !v || a.scores.includes(k) === (v === 1)))
        .sort((a, b) => rank(b) - rank(a) || a.dist - b.dist)
        .slice(0, 20);
    state.stage = 'results';
    state.selected = null;
};

        <div class="actions">
            ${desktop && state.tab !== 'scenery' ? `<button type="button" class="btn${state.sceneryOpen ? ' on' : ''}" aria-pressed="${state.sceneryOpen}" data-act="toggleCard" data-card="scenery">${ico('map', 15)} Scenery</button>` : ''}
            ${desktop && flightsContext(a) ? `<button type="button" class="btn${state.flightsOpen ? ' on' : ''}" aria-pressed="${state.flightsOpen}" data-act="toggleCard" data-card="flights">${ico('list', 15)} Flights</button>` : ''}
            <button type="button" class="btn" data-act="useAsAnchor">${ico('pencil', 15)} Use as ${anchorIsDeparture ? 'Departure' : 'Arrival'}</button>
            <a class="btn light" target="_blank" rel="noopener" href="https://dispatch.simbrief.com/options/custom?orig=${orig}&dest=${dest}">SimBrief ${ico('external', 14)}</a>
            <a class="btn light" target="_blank" rel="noopener" href="https://windy.com/${a.icao}">Windy ${ico('external', 14)}</a>
        </div>`;
};

const routeLabel = (a) => (state.mode === 'departure' ? `${a.icao} to ${state.anchor}` : `${state.anchor} to ${a.icao}`);

const cardFlights = (a, desktop) => {
    const flights = mockFlights(a);
    if (!flights.length) return `<div class="scn">No known flights ${routeLabel(a)} in the mock data.</div>`;
    const airlines = [...new Set(flights.map((f) => f.airline))];
    const airline = airlines.includes(state.airline) ? state.airline : 'All';
    return `
        ${desktop ? '' : `<p style="margin:0 0 0.75rem">${routeLabel(a)}</p>`}
        ${airlines.length > 1 ? `<div class="chips" style="margin-bottom:0.75rem">${['All', ...airlines].map((n) => `<button type="button" class="btn${airline === n ? ' on' : ''}" aria-pressed="${airline === n}" data-act="airline" data-airline="${n}">${n === 'All' ? 'All airlines' : `[${n}]`}</button>`).join('')}</div>` : ''}
        <table class="ftable">
            <thead><tr><th scope="col">Flight</th><th scope="col">Airline</th><th scope="col">Aircraft</th><th scope="col">Last seen</th></tr></thead>
            <tbody>${flights.filter((f) => airline === 'All' || f.airline === airline).map((f) => `<tr><td>${f.flight}</td><td>[${f.airline}]</td><td>${f.aircraft}</td><td>${f.seen}</td></tr>`).join('')}</tbody>
        </table>`;
};

const cardScenery = (a) => `<div style="display:flex;flex-direction:column;gap:0.6rem">
    ${a.sims.length ? a.sims.map((s, i) => `<div class="scn"><div><b>${s}</b><span>[Developer] · ${i % 2 ? 'Freeware' : 'Payware'}</span></div><span class="btn light">[Store link]</span></div>`).join('')
        : '<div class="scn">No scenery in the mock data for this airport.</div>'}
</div>`;

const CARDS = {
    airport: { label: 'Airport', body: cardAirport, title: (a) => [a.icao, a.name], close: 'back', count: () => '' },
    flights: { label: 'Flights', body: cardFlights, title: (a) => ['Flights', routeLabel(a)], close: 'toggleCard', count: (a) => mockFlights(a).length },
    scenery: { label: 'Scenery', body: cardScenery, title: (a) => ['Scenery', `${a.icao} · ${a.name}`], close: 'toggleCard', count: (a) => a.sims.length },
};

// The Scenery page leads with scenery; everywhere else the airport comes first.
const cardsFor = (a) => (state.tab === 'scenery' ? ['scenery', 'airport'] : ['airport', ...(flightsContext(a) ? ['flights'] : []), 'scenery']);

const viewDetail = (desktop) => {
    const a = BY_ICAO[state.selected];
    const cards = cardsFor(a);
    if (desktop) {
        const open = { airport: true, flights: state.flightsOpen, scenery: state.sceneryOpen || state.tab === 'scenery' };
        return cards.filter((c) => open[c]).map((c) => {
            const [title, sub] = CARDS[c].title(a);
            return `<section class="card" id="card-${c}" aria-label="${CARDS[c].label}">
                <div class="detail-head"><div><h2>${title}</h2><p>${esc(sub)}</p></div>
                    <button type="button" class="btn light" style="min-width:44px;padding:0" aria-label="Close ${CARDS[c].label.toLowerCase()} card" data-act="${state.tab === 'scenery' ? 'back' : CARDS[c].close}" data-card="${c}">${ico('close')}</button></div>
                ${CARDS[c].body(a, true)}
            </section>`;
        }).join('');
    }
    const active = cards.includes(state.card) ? state.card : cards[0];
    return `<div class="cardtabs" role="tablist" aria-label="Airport information">
            ${cards.map((c) => `<button type="button" role="tab" id="tab-${c}" aria-selected="${c === active}" data-act="card" data-card="${c}">${CARDS[c].label}${CARDS[c].count(a) === '' ? '' : `<span>${CARDS[c].count(a)}</span>`}</button>`).join('')}
        </div>
        <div class="pad" role="tabpanel" aria-labelledby="tab-${active}">${CARDS[active].body(a, false)}</div>`;
};

const pageTitle = () => {
    if (state.tab === 'top') return ['Top Airports Right Now', 'Destinations with the worst weather right now'];
    if (state.tab === 'scenery') return ['Scenery', 'Find scenery for your flight simulator'];
    if (state.tab === 'more') return ['More', 'Feedback, account and links'];
    if (state.stage === 'results') return ['Search results', `${state.results.length} ${state.mode === 'departure' ? 'departure' : 'arrival'} suggestions for ${state.anchor}`];
    if (state.stage === 'routes') return ['Search results', `Flights ${state.anchor} to ${state.other}`];
    return ['Search for your flight', 'Find destinations based on your weather or coverage criteria'];
};

let lastView = '';
let listScroll = 0;

const render = () => {
    const mobile = isMobile();
    const sel = state.selected ? BY_ICAO[state.selected] : null;
    document.body.classList.toggle('has-selected', !!sel);

    const [title, sub] = mobile && sel ? [sel.icao, sel.name] : pageTitle();
    $('title').textContent = title;
    $('sub').textContent = sub;
    $('handle').setAttribute('aria-label', mobile ? `${title}. Drag or press to resize the panel` : title);
    $('handle').tabIndex = mobile ? 0 : -1;

    const panel = state.tab === 'top' ? viewTop() : state.tab === 'scenery' ? viewScenery() : state.tab === 'more' ? viewMore()
        : state.stage === 'results' ? viewResults() : state.stage === 'routes' ? viewRoutes() : viewForm();
    // A new view starts at the top; coming back from an airport returns to where the list was.
    const view = [state.tab, state.stage, mobile && sel ? 'detail' : 'list'].join();
    const keep = view === lastView ? $('body').scrollTop : view.endsWith('list') && lastView === view.replace('list', 'detail') ? listScroll : 0;
    if (view.endsWith('detail') && lastView !== view) listScroll = $('body').scrollTop;
    lastView = view;
    $('body').innerHTML = mobile && sel ? viewDetail(false) : panel;
    $('body').scrollTop = keep;
    $('detail').innerHTML = !mobile && sel ? viewDetail(true) : '';

    const nav = (withIcons) => TABS.map(([id, label, icon]) => `<button type="button" data-act="tab" data-tab="${id}" aria-current="${state.tab === id ? 'page' : 'false'}">${ico(icon, withIcons ? 20 : 16)}${label}</button>`).join('');
    $('tabbar').innerHTML = nav(true);
    $('topnav').innerHTML = TABS.slice(0, 3).map(([id, label, icon]) => `<button type="button" data-act="tab" data-tab="${id}" aria-current="${state.tab === id ? 'page' : 'false'}">${ico(icon, 16)}${label}</button>`).join('')
        + `<button type="button">${ico('message', 16)}Feedback</button><button type="button">${ico('lock', 16)}Login</button>`;

    syncTimeSlider();
    updateMapData();
};

const syncTimeSlider = () => {
    if (!$('minTime')) return;
    $('timeOut').textContent = `${hm(state.minTime)} to ${hm(state.maxTime)}`;
    $('timeFill').style.left = `${state.minTime / 8 * 100}%`;
    $('timeFill').style.width = `${(state.maxTime - state.minTime) / 8 * 100}%`;
};

/* ---------- Bottom sheet ---------- */

const snapY = (name) => {
    const h = $('stage').clientHeight;
    return { full: 0, half: Math.round(h * 0.5), peek: Math.max(0, h - HANDLE_H) }[name];
};
const sheetVisible = () => (isMobile() ? $('stage').clientHeight - snapY(state.snap) : 0);
const setSnap = (name) => {
    state.snap = name;
    $('sheet').style.setProperty('--y', `${isMobile() ? snapY(name) : 0}px`);
};

let drag = null;
$('handle').addEventListener('pointerdown', (e) => {
    if (!isMobile()) return;
    drag = { y0: e.clientY, base: snapY(state.snap), y: snapY(state.snap), moved: false, t: e.timeStamp, v: 0 };
    $('handle').setPointerCapture(e.pointerId);
});
$('handle').addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dy = e.clientY - drag.y0;
    if (Math.abs(dy) > 4 && !drag.moved) { drag.moved = true; $('sheet').classList.add('dragging'); }
    if (!drag.moved) return;
    const y = Math.min(snapY('peek'), Math.max(0, drag.base + dy));
    drag.v = (y - drag.y) / Math.max(1, e.timeStamp - drag.t);
    drag.y = y;
    drag.t = e.timeStamp;
    $('sheet').style.setProperty('--y', `${y}px`);
});
const endDrag = () => {
    if (!drag) return;
    const d = drag;
    drag = null;
    $('sheet').classList.remove('dragging');
    const order = ['full', 'half', 'peek'];
    if (!d.moved) return setSnap(state.snap === 'peek' ? 'half' : state.snap === 'half' ? 'full' : 'half');
    // A flick goes one stop in its direction, a slow drag settles on the nearest stop.
    if (Math.abs(d.v) > 0.5) {
        const next = order.filter((n) => (d.v > 0 ? snapY(n) > d.y : snapY(n) < d.y));
        return setSnap(next.length ? (d.v > 0 ? next[0] : next[next.length - 1]) : (d.v > 0 ? 'peek' : 'full'));
    }
    setSnap(order.reduce((best, n) => (Math.abs(snapY(n) - d.y) < Math.abs(snapY(best) - d.y) ? n : best)));
};
$('handle').addEventListener('pointerup', endDrag);
$('handle').addEventListener('pointercancel', endDrag);
// Pointer taps are handled above; this is the keyboard path only.
$('handle').addEventListener('click', (e) => {
    if (e.detail === 0 && isMobile()) setSnap(state.snap === 'peek' ? 'half' : state.snap === 'half' ? 'full' : 'peek');
});
// The on-screen keyboard would cover a half-height sheet.
$('body').addEventListener('focusin', (e) => {
    if (isMobile() && e.target.matches('input:not([type=checkbox]):not([type=range])') && state.snap !== 'full') setSnap('full');
});

/* ---------- Actions ---------- */

const select = (icao) => {
    Object.assign(state, { selected: icao, tafOpen: false, airline: 'All', flightsOpen: true, card: state.tab === 'scenery' ? 'scenery' : 'airport' });
    if (state.tab === 'more') state.tab = 'search';
    if (isMobile()) setSnap('half');
    render();
    focusAirport(BY_ICAO[icao]);
};

const ACTIONS = {
    tab: (el) => {
        Object.assign(state, { tab: el.dataset.tab, selected: null, tafOpen: false });
        setSnap(state.tab === 'more' ? 'full' : 'half');
        render();
        fitToView();
    },
    mode: (el) => { state.mode = el.dataset.mode; state.formError = ''; render(); },
    toggleFilters: () => { state.showFilters = !state.showFilters; if (state.showFilters) setSnap('full'); render(); },
    filter: (el) => { state.filters[el.dataset.key] = Number(el.dataset.val); render(); },
    edit: () => { state.stage = 'form'; state.selected = null; setSnap('full'); render(); },
    randomise: () => { state.results = [...state.results].sort(() => Math.random() - 0.5); render(); },
    select: (el) => select(el.dataset.icao),
    back: () => { state.selected = null; state.tafOpen = false; render(); },
    taf: () => { state.tafOpen = !state.tafOpen; render(); },
    sim: (el) => { state.sim = el.dataset.sim; render(); },
    card: (el) => { state.card = el.dataset.card; render(); $('body').scrollTop = 0; },
    toggleCard: (el) => {
        const key = `${el.dataset.card}Open`;
        state[key] = !state[key];
        render();
        if (state[key]) document.getElementById(`card-${el.dataset.card}`)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    },
    airline: (el) => { state.airline = el.dataset.airline; render(); },
    useAsAnchor: () => {
        Object.assign(state, { tab: 'search', stage: 'form', anchor: state.selected, selected: null, formError: '' });
        setSnap('half');
        render();
    },
};

document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (el && ACTIONS[el.dataset.act]) ACTIONS[el.dataset.act](el);
});

$('body').addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'minTime' || t.id === 'maxTime') {
        let [lo, hi] = [Number($('minTime').value), Number($('maxTime').value)];
        if (lo > hi - 0.5) { if (t.id === 'minTime') lo = hi - 0.5; else hi = lo + 0.5; }
        [$('minTime').value, $('maxTime').value] = [lo, hi];
        [state.minTime, state.maxTime] = [lo, hi];
        return syncTimeSlider();
    }
    const key = t.dataset.bind;
    if (!key) return;
    if (t.type === 'checkbox') state[key] = t.checked;
    else if (key === 'topExcludeVatsim') { state[key] = !!t.value; render(); } else if (t.classList.contains('icao')) state[key] = t.value.toUpperCase().trim();
    else state[key] = t.value;
});

$('body').addEventListener('submit', (e) => {
    e.preventDefault();
    if (e.target.id === 'searchForm') {
        runSearch();
        if (!state.formError) setSnap('half');
        render();
        if (!state.formError) fitToView();
    }
    if (e.target.id === 'sceneryForm') {
        const icao = $('sceneryIcao').value.toUpperCase().trim();
        state.sceneryNotFound = !BY_ICAO[icao];
        if (BY_ICAO[icao]) select(icao); else render();
    }
});

$('layersBtn').innerHTML = ico('layers', 20);
$('closeBtn').innerHTML = ico('close');
$('layersBtn').addEventListener('click', () => {
    const open = $('layersPanel').hidden;
    $('layersPanel').hidden = !open;
    $('layersBtn').setAttribute('aria-expanded', String(open));
});

/* ---------- Map (MapLibre GL, CARTO dark matter, as in the app) ---------- */

let map = null;
let mapReady = false;

const markerKind = (a) => {
    if (state.selected === a.icao) return 'sel';
    if (state.tab === 'search') {
        if (a.icao === state.anchor) return 'dep';
        if (state.stage === 'results' && state.results.some((r) => r.icao === a.icao)) return 'result';
        if (state.stage === 'routes' && a.icao === state.other) return 'result';
    }
    if (state.tab === 'top' && topList().includes(a)) return 'result';
    if (state.tab === 'scenery' && sceneryList().includes(a)) return 'result';
    return 'dim';
};

const routeFeatures = () => {
    if (state.tab !== 'search') return [];
    const anchor = BY_ICAO[state.anchor];
    const line = (to, selected) => ({ type: 'Feature', properties: { selected }, geometry: { type: 'LineString', coordinates: greatCircle(anchor, to) } });
    if (state.stage === 'routes') return [line(BY_ICAO[state.other], true)];
    if (state.stage !== 'results') return [];
    return state.results.map((r) => line(r, r.icao === state.selected));
};

const updateMapData = () => {
    if (!mapReady) return;
    map.getSource('airports').setData({
        type: 'FeatureCollection',
        features: AIRPORTS.map((a) => ({ type: 'Feature', properties: { icao: a.icao, kind: markerKind(a) }, geometry: { type: 'Point', coordinates: [a.lon, a.lat] } })),
    });
    map.getSource('routes').setData({ type: 'FeatureCollection', features: routeFeatures() });
};

// Screen area the sheet (mobile) or the airport card (desktop) covers, so the camera can aim at what is left.
const cover = () => (isMobile()
    ? { bottom: sheetVisible(), left: 0 }
    : { bottom: 30, left: state.selected ? $('detail').offsetWidth + 16 : 0 });

const focusAirport = (a) => {
    if (!mapReady) return;
    const c = cover();
    map.easeTo({ center: [a.lon, a.lat], zoom: Math.max(map.getZoom(), 4.5), offset: [c.left / 2, -c.bottom / 2], duration: 600 });
};

const fitToView = () => {
    if (!mapReady) return;
    const shown = AIRPORTS.filter((a) => markerKind(a) !== 'dim');
    if (shown.length < 2) return;
    const lons = shown.map((a) => a.lon);
    const lats = shown.map((a) => a.lat);
    const c = cover();
    const room = map.getContainer().clientHeight - c.bottom;
    map.fitBounds([[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]], {
        padding: { top: 60, right: 60, left: 40 + c.left, bottom: (room > 160 ? c.bottom : 0) + 40 },
        maxZoom: 7,
        duration: 600,
    });
};

const kindMatch = (sel, dep, result, dim) => ['match', ['get', 'kind'], 'sel', sel, 'dep', dep, 'result', result, dim];

const initMap = async () => {
    let maplibregl;
    try {
        const [lib, worker] = await Promise.all([
            import(`${MAPLIBRE}/maplibre-gl.mjs`),
            fetch(`${MAPLIBRE}/maplibre-gl-worker.mjs`).then((r) => (r.ok ? r.text() : Promise.reject(new Error(r.status)))),
        ]);
        maplibregl = lib;
        // v6 wants a same-origin worker, so it gets a blob copy of the CDN one. Chrome refuses module
        // workers on file://, hence the classic variant: export stripped, "#.cjs" makes MapLibre pick it.
        const classic = location.protocol === 'file:';
        const blob = new Blob([classic ? worker.replace(/export\{\w+ as default\};?/, '') : worker], { type: 'text/javascript' });
        maplibregl.setWorkerUrl(URL.createObjectURL(blob) + (classic ? '#.cjs' : ''));
    } catch (err) {
        $('map').insertAdjacentHTML('afterend', '<div class="map-error">The map library could not be loaded (offline?). The panels still work.</div>');
        return;
    }

    map = new maplibregl.Map({
        container: 'map',
        style: CARTO_STYLE,
        center: [8, 57],
        zoom: 3.2,
        minZoom: 0,
        maxZoom: 17,
        attributionControl: false,
        dragRotate: false,
        pitchWithRotate: false,
        touchPitch: false,
        // Same idea as themedStyle() in mapConfig.js: the app's dark overrides written into CARTO's style.
        transformStyle: (_, next) => ({
            ...next,
            glyphs: next.glyphs || CARTO_GLYPHS,
            projection: { type: document.querySelector('[name=projection]:checked').value },
            sky: { 'sky-color': '#040404', 'horizon-color': '#262626', 'fog-color': '#090909', 'sky-horizon-blend': 0.5, 'horizon-fog-blend': 0.6, 'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 0.6, 5, 0.4, 7, 0] },
            layers: next.layers.map((l) => {
                const paint = { background: { 'background-color': '#090909' }, water: { 'fill-color': '#262626' }, waterway: { 'line-color': '#3a3a3a' } }[l.id];
                return paint ? { ...l, paint: { ...l.paint, ...paint } } : l;
            }),
        }),
    });
    map.touchZoomRotate.disableRotation();
    window.w2fMap = map;

    map.on('error', (e) => console.warn('map error', e.error?.message ?? e));

    map.on('load', () => {
        map.addSource('routes', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
        map.addSource('airports', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
        map.addLayer({ id: 'routes', type: 'line', source: 'routes', filter: ['!', ['get', 'selected']], paint: { 'line-color': '#ddb81c', 'line-width': 1, 'line-opacity': 0.35 } });
        map.addLayer({ id: 'route-selected', type: 'line', source: 'routes', filter: ['get', 'selected'], paint: { 'line-color': '#ddb81c', 'line-width': 2.5 } });
        map.addLayer({
            id: 'airports', type: 'circle', source: 'airports',
            layout: { 'circle-sort-key': kindMatch(3, 2, 1, 0) },
            paint: {
                'circle-radius': kindMatch(8, 7, 5.5, 3.5),
                'circle-color': kindMatch('#fffdf7', '#ddb81c', '#ddb81c', '#808080'),
                'circle-stroke-width': kindMatch(4, 2, 1, 0),
                'circle-stroke-color': kindMatch('#ddb81c', '#fffdf7', '#161925', '#000000'),
            },
        });
        map.addLayer({
            id: 'airport-labels', type: 'symbol', source: 'airports', filter: ['!=', ['get', 'kind'], 'dim'],
            layout: { 'text-field': ['get', 'icao'], 'text-font': ['Open Sans Bold'], 'text-size': 12, 'text-anchor': 'top', 'text-offset': [0, 0.9], 'symbol-sort-key': kindMatch(0, 1, 2, 3) },
            paint: { 'text-color': '#fffdf7', 'text-halo-color': '#161925', 'text-halo-width': 1.5 },
        });
        // Invisible finger-sized target on top of every dot.
        map.addLayer({ id: 'airports-hit', type: 'circle', source: 'airports', paint: { 'circle-radius': 18, 'circle-opacity': 0 } });

        map.on('click', (e) => {
            const hit = map.queryRenderedFeatures(e.point, { layers: ['airports-hit'] });
            if (hit.length) {
                const [x, y] = [e.point.x, e.point.y];
                const nearest = hit.map((f) => ({ f, p: map.project(f.geometry.coordinates) })).sort((a, b) => Math.hypot(a.p.x - x, a.p.y - y) - Math.hypot(b.p.x - x, b.p.y - y))[0].f;
                return select(nearest.properties.icao);
            }
            if (isMobile()) setSnap('peek');
        });
        map.on('mousemove', 'airports-hit', () => { map.getCanvas().style.cursor = 'pointer'; });
        map.on('mouseleave', 'airports-hit', () => { map.getCanvas().style.cursor = ''; });

        mapReady = true;
        updateMapData();
    });

    document.querySelectorAll('[name=projection]').forEach((r) => r.addEventListener('change', () => map.setProjection({ type: r.value })));
};

/* ---------- Boot ---------- */

const onViewportChange = () => { setSnap(state.snap); render(); };
mobileQuery.addEventListener('change', onViewportChange);
window.addEventListener('resize', () => setSnap(state.snap));

setSnap('half');
render();
initMap();
</script>
</body>
</html>
